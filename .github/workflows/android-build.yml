name: Build Android Artifacts

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Generate Android platform scaffold
        run: |
          rm -rf /tmp/agro_scaffold
          flutter create --platforms=android --org com.agroconnect --project-name agro_connect /tmp/agro_scaffold
          rm -rf android
          cp -R /tmp/agro_scaffold/android ./android
          cp tool/android/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

      - name: Install packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Build release App Bundle
        run: flutter build appbundle --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: agro-connect-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: agro-connect-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
