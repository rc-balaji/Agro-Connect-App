name: Build Android Artifacts

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Download offline Leaf AI model
        run: bash tool/fetch_ai_model.sh

      - name: Generate Android platform scaffold
        run: |
          rm -rf /tmp/agro_scaffold
          flutter create --platforms=android --org com.agroconnect --project-name agro_connect /tmp/agro_scaffold
          rm -rf android
          cp -R /tmp/agro_scaffold/android ./android
          cp tool/android/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/res/drawable
          cp tool/android/ic_stat_agro.xml android/app/src/main/res/drawable/ic_stat_agro.xml
          python3 - <<'PY'
          from pathlib import Path
          for candidate in [Path('android/app/build.gradle.kts'), Path('android/app/build.gradle')]:
              if not candidate.exists():
                  continue
              text = candidate.read_text()
              text = text.replace('minSdk = flutter.minSdkVersion', 'minSdk = 24')
              text = text.replace('minSdkVersion flutter.minSdkVersion', 'minSdkVersion 24')
              candidate.write_text(text)
          PY

      - name: Configure Firebase Android
        run: python3 tool/patch_android_firebase.py

      - name: Align Android Java/Kotlin JVM targets
        run: python3 tool/patch_android_jvm.py

      - name: Configure Android notification desugaring
        run: python3 tool/patch_android_notifications.py

      - name: Install packages
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build test APK (App Check debug provider)
        env:
          AGRO_APP_CHECK_DEBUG_TOKEN: ${{ secrets.AGRO_APP_CHECK_DEBUG_TOKEN }}
        run: |
          python3 tool/write_debug_defines.py "$RUNNER_TEMP/agro-debug.json"
          flutter build apk --release --dart-define-from-file="$RUNNER_TEMP/agro-debug.json"

      - name: Remove temporary test configuration
        if: always()
        run: rm -f "$RUNNER_TEMP/agro-debug.json"

      - name: Build release App Bundle
        run: flutter build appbundle --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: agro-connect-test-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: agro-connect-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
