name: agro_connect
version: 1.1.0+2
publish_to: none

description: AGRO CONNECT realtime smart farming mobile app.

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  mqtt_client: ^10.11.11
  connectivity_plus: ^7.3.1
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  fl_chart: ^1.2.0
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/branding/app_icon.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/branding/app_icon.png
  adaptive_icon_foreground: assets/branding/app_icon.png
  adaptive_icon_background: '#07130F'
  min_sdk_android: 21
