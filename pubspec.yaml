name: agro_connect
version: 1.5.0+7
publish_to: none

description: AGRO CONNECT realtime smart farming mobile app with offline Leaf AI.

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  mqtt_client: ^10.11.11
  connectivity_plus: ^7.3.1
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  fl_chart: ^1.2.0
  http: ^1.2.2
  camera: ^0.12.0+1
  image_picker: ^1.2.2
  tflite_flutter: ^0.12.1
  image: ^4.10.1
  flutter_foreground_task: ^10.0.0
  flutter_local_notifications: ^19.5.0
  firebase_core: ^4.15.0
  firebase_ai: ^4.0.0
  firebase_app_check: ^0.4.8
  firebase_database: ^12.6.0
  firebase_auth: ^6.7.0
  speech_to_text: ^7.4.0
  flutter_tts: ^4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/branding/app_icon.png
    - assets/models/plant_disease_mobilenetv3.tflite
    - assets/models/labels.txt

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/branding/app_icon.png
  adaptive_icon_foreground: assets/branding/app_icon.png
  adaptive_icon_background: '#07130F'
  min_sdk_android: 24
